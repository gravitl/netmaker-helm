{{- if and .Values.emqx.enabled (eq .Values.mq.backend "emqx") .Values.mq.emqxBootstrap.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netmaker.fullname" . }}-emqx-bootstrap
  labels:
    {{- include "netmaker.labels" . | nindent 4 }}
type: Opaque
stringData:
  mq-username: {{ .Values.mq.username | quote }}
  mq-password: {{ .Values.mq.password | quote }}
  dashboard-password: {{ .Values.emqx.emqxConfig.EMQX_DASHBOARD__DEFAULT_PASSWORD | default .Values.mq.password | quote }}
{{- end }}
